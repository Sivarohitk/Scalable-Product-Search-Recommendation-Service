services:
  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/product_search
      APP_REDIS_URL: redis://redis:6379/0
      APP_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_API_PORT:-8000}:8000"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: product_search
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_search"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${APP_DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${APP_REDIS_PORT:-6379}:6379"
